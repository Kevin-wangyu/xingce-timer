<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>防烧屏 · 记录计时器</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="timerDisplay"></div>
    <div class="controls" id="controls">
        <button id="startBtn">▶ 开始</button>
        <button id="resetBtn">↺ 重置</button>
        <button id="fullscreenBtn">⛶ 全屏</button>
        <button id="moduleBtn" class="module-btn">📚 模块</button>
        <button id="examBtn" class="exam-btn">🎓 考试</button>
        <button id="settingsBtn" class="settings-btn">⚙️ 设置</button>

        <span class="status-hint" id="statusHint">⚡ 自动常亮</span>
    </div>

    <!-- 模块菜单 -->
    <div class="modal-overlay" id="moduleMenuModal">
        <div class="modal-card" style="max-width: 380px;">
            <button class="close-btn" id="closeModuleMenu">&times;</button>
            <h2>📚 模块</h2>
            <div style="display:flex; flex-direction:column; gap:12px; margin-top:8px;">
                <button id="moduleRecordBtn" class="menu-btn primary">📝 模块记录</button>
                <button id="moduleViewBtn" class="menu-btn">📋 查看记录</button>
                <button id="moduleChartBtn" class="menu-btn">📈 图表</button>
            </div>
        </div>
    </div>

    <!-- 考试菜单 -->
    <div class="modal-overlay" id="examMenuModal">
        <div class="modal-card" style="max-width: 380px;">
            <button class="close-btn" id="closeExamMenu">&times;</button>
            <h2>🎓 考试</h2>
            <div style="display:flex; flex-direction:column; gap:12px; margin-top:8px;">
                <button id="examRecordBtn" class="menu-btn exam">📝 考试记录</button>
                <button id="examViewBtn" class="menu-btn">📋 查看考试记录</button>
                <button id="examChartBtn" class="menu-btn">📈 图表</button>
            </div>
        </div>
    </div>

    <!-- 模块记录表单 -->
    <div class="modal-overlay" id="moduleRecordModal">
        <div class="modal-card">
            <button class="close-btn" id="closeModuleRecord">&times;</button>
            <h2 id="moduleRecordTitle">📝 模块记录</h2>
            <div class="field">
                <label>📅 日期时间</label>
                <input type="text" id="moduleDate" placeholder="例如：2025-01-01 12:00:00">
            </div>
            <div class="field">
                <label>⏱ 用时</label>
                <input type="text" id="moduleTime" placeholder="例如：00:05:30">
            </div>
            <div class="field">
                <label>📂 模块</label>
                <select id="moduleSelect">
                    <option value="政治">政治</option>
                    <option value="常识">常识</option>
                    <option value="言语">言语</option>
                    <option value="数量">数量</option>
                    <option value="判断">判断</option>
                    <option value="资料">资料</option>
                </select>
            </div>
            <div class="field">
                <label>🎯 正确率</label>
                <input type="text" id="moduleAccuracy" placeholder="输入如 8/10 或 80（自动转%）">
            </div>
            <div class="field">
                <label>❌ 错误原因</label>
                <input type="text" id="moduleError" placeholder="简要描述错误原因">
            </div>
            <div class="field">
                <label>📝 备注</label>
                <textarea id="moduleRemark" placeholder="可选备注"></textarea>
            </div>
            <div class="btn-row">
                <button id="cancelModuleRecord">取消</button>
                <button id="saveModuleRecord" class="primary">💾 保存</button>
            </div>
        </div>
    </div>

    <!-- 模块查看记录 -->
    <div class="modal-overlay" id="moduleViewModal">
        <div class="modal-card">
            <button class="close-btn" id="closeModuleView">&times;</button>
            <h2>📋 模块记录</h2>
            <div id="moduleRecordList"></div>
            <div class="btn-row" style="justify-content:space-between; margin-top:12px;">
                <button id="clearModuleRecords" class="danger">🗑 清空全部</button>
                <div style="display:flex; gap:8px;">
                    <button id="exportModuleCsv" class="export-csv">📊 导出 CSV</button>
                    <button id="exportModuleTxt" class="export-txt">📄 导出 TXT</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 模块图表 -->
    <div class="modal-overlay" id="moduleChartModal">
        <div class="modal-card" style="max-width: 800px;">
            <button class="close-btn" id="closeModuleChart">&times;</button>
            <h2>📈 模块正确率趋势</h2>
            <div class="field">
                <label>选择模块</label>
                <select id="chartModule">
                    <option value="政治">政治</option>
                    <option value="常识">常识</option>
                    <option value="言语">言语</option>
                    <option value="数量">数量</option>
                    <option value="判断">判断</option>
                    <option value="资料">资料</option>
                </select>
            </div>
            <div class="chart-container">
                <canvas id="moduleChartCanvas"></canvas>
            </div>
            <div id="moduleChartNoData" style="display:none; text-align:center; padding:20px; color:rgba(255,255,255,0.5);">
                该模块暂无记录
            </div>
        </div>
    </div>

    <!-- 考试记录表单 -->
    <div class="modal-overlay" id="examRecordModal">
        <div class="modal-card">
            <button class="close-btn" id="closeExamRecord">&times;</button>
            <h2 id="examRecordTitle">📝 考试记录</h2>
            <div class="field">
                <label>📅 日期时间</label>
                <input type="text" id="examDate" placeholder="例如：2025-01-01 12:00:00">
            </div>
            <div class="field">
                <label>⏱ 计时时间</label>
                <input type="text" id="examTime" placeholder="例如：02:00:00">
            </div>
            <div style="margin-top:6px; margin-bottom:6px; font-size:0.75rem; letter-spacing:1px; color:rgba(255,255,255,0.5); text-transform:uppercase;">各模块正确率</div>
            <div class="grid-2">
                <div class="field"><label>政治</label><input type="text" class="exam-accuracy" data-module="政治" placeholder="如 8/10"></div>
                <div class="field"><label>常识</label><input type="text" class="exam-accuracy" data-module="常识" placeholder="如 8/10"></div>
                <div class="field"><label>言语</label><input type="text" class="exam-accuracy" data-module="言语" placeholder="如 8/10"></div>
                <div class="field"><label>数量</label><input type="text" class="exam-accuracy" data-module="数量" placeholder="如 8/10"></div>
                <div class="field"><label>判断</label><input type="text" class="exam-accuracy" data-module="判断" placeholder="如 8/10"></div>
                <div class="field"><label>资料</label><input type="text" class="exam-accuracy" data-module="资料" placeholder="如 8/10"></div>
            </div>
            <div class="field">
                <label>🎯 最终得分</label>
                <input type="text" id="examScore" placeholder="例如：85">
            </div>
            <div class="field">
                <label>❌ 错误原因</label>
                <input type="text" id="examError" placeholder="简要描述错误原因">
            </div>
            <div class="field">
                <label>📝 备注</label>
                <textarea id="examRemark" placeholder="可选备注"></textarea>
            </div>
            <div class="btn-row">
                <button id="cancelExamRecord">取消</button>
                <button id="saveExamRecord" class="primary">💾 保存</button>
            </div>
        </div>
    </div>

    <!-- 查看考试记录 -->
    <div class="modal-overlay" id="examViewModal">
        <div class="modal-card">
            <button class="close-btn" id="closeExamView">&times;</button>
            <h2>📋 考试记录</h2>
            <div id="examRecordList"></div>
            <div class="btn-row" style="justify-content:space-between; margin-top:12px;">
                <button id="clearExamRecords" class="danger">🗑 清空全部</button>
                <div style="display:flex; gap:8px;">
                    <button id="exportExamCsv" class="export-csv">📊 导出 CSV</button>
                    <button id="exportExamTxt" class="export-txt">📄 导出 TXT</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 考试图表 -->
    <div class="modal-overlay" id="examChartModal">
        <div class="modal-card" style="max-width: 900px;">
            <button class="close-btn" id="closeExamChart">&times;</button>
            <h2>📈 考试图表</h2>
            <div class="chart-tabs">
                <button class="chart-tab active" data-tab="score">📊 考试分数变化</button>
                <button class="chart-tab" data-tab="modules">📈 模块正确率变化</button>
            </div>
            <div id="scoreChartContainer" class="chart-container">
                <canvas id="examScoreChart"></canvas>
            </div>
            <div id="modulesChartContainer" class="chart-container" style="display:none;">
                <canvas id="examModulesChart"></canvas>
            </div>
            <div id="examChartNoData" style="display:none; text-align:center; padding:20px; color:rgba(255,255,255,0.5);">
                暂无考试记录
            </div>
        </div>
    </div>

    <!-- ============ 设置页 ============ -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <button class="close-btn" id="closeSettings">&times;</button>
            <h2>⚙️ 设置</h2>

            <!-- 数据备份 -->
            <div class="settings-section">
                <h3>📦 数据备份</h3>
                <div class="btn-row" style="justify-content:flex-start;">
                    <button id="exportAllBtn" class="export-csv">📤 导出全部数据</button>
                    <button id="importAllBtn" class="export-txt">📥 导入数据</button>
                </div>
                <input type="file" id="importFileInput" accept=".json,application/json" style="display:none;">
                <div class="gist-hint">导出为 JSON 文件，包含模块记录与考试记录。导入将<b>替换</b>现有数据。</div>
            </div>

            <!-- Gist 同步 -->
            <div class="settings-section">
                <h3>☁️ GitHub Gist 同步</h3>
                <div class="field">
                    <label>GitHub Token</label>
                    <input type="password" id="gistToken" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">
                </div>
                <div class="btn-row" style="justify-content:flex-start;">
                    <button id="syncGistBtn" class="primary">🔄 立即同步</button>
                </div>
                <div id="gistStatus" class="gist-status">未同步</div>
                <div class="gist-hint">
                    Token 需要 <b>gist</b> 权限，<a href="https://github.com/settings/tokens/new?scopes=gist&description=TimerBackup" target="_blank">点击此处创建</a>。<br>
                    首次同步会自动创建私密 Gist，此后每次点击都覆盖更新。
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="js/func.js"></script>
</body>
</html>
